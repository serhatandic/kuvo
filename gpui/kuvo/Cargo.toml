[package]
name = "kuvo"
description = "Kuvo, the desktop client of a Kuvo box: its sessions, conversations and composer"
edition.workspace = true
version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
kuvo_ui.workspace = true
kuvo_box = { path = "../kuvo_box" }
anyhow = "1"
# The installer's steps, handed from the thread that runs it to the window.
async-channel = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A picture pasted as TIFF or BMP (Safari, Preview) kept as a PNG the engine takes (pasted.rs),
# and a conversation's pictures measured to fit (pictures.rs); the same crate GPUI already builds.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif", "webp"] }

# The app's device key, in the Mac's keychain; and where System Settings' window is, with the
# drag tile's own window moved beside it (permissions/mac.rs).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
core-foundation = "0.10"
core-graphics = "0.24"
libc = "0.2"
objc2 = "0.6"
raw-window-handle = "0.6"
# Your settings' Notifications and General: the Dock's count, and which editors
# are on this Mac (notifications.rs, yours/mac.rs); and the app updating itself, Sparkle loaded
# from the bundle and driven through its classes (updates/sparkle.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle", "NSURL", "NSSet", "NSUserDefaults", "NSDate", "NSError", "NSDictionary", "NSArray", "NSObject", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder", "NSWorkspace"] }
# Posting notifications with macOS's own sound (Focus and System Settings silence it), clicks
# going to GPUI's delegate by the same identifier.
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "0.6"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# The tests run against the stand-in box.
kuvo = { path = ".", features = ["stand-in"] }
# Waiting on a view's notifications while the follows' threads hand on what they read.
futures = "0.3"
# A stand-in app bundle, in a folder that goes with its test.
tempfile = "3"
# A picture a message carries, written as the engine keeps it.
base64 = "0.22"

[features]
# The made-up box (`--stand-in`), and reading it at once for shots and tests; not in the app shipped.
stand-in = ["kuvo_box/stand-in"]
# Offscreen rendering for the shots binary; pulls in GPUI's test support.
shots = ["stand-in", "gpui/test-support", "gpui_platform/test-support"]

[[bin]]
name = "kuvo"
path = "src/main.rs"

[[bin]]
name = "shots"
path = "src/bin/shots.rs"
required-features = ["shots"]

[[bin]]
name = "scroll_bench"
path = "src/bin/scroll_bench.rs"
required-features = ["shots"]
