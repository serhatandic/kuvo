[package]
name = "kuvo_box"
description = "A client of a Kuvo box: finding it, its update gate, its session lists, conversations and typed messages"
edition.workspace = true
version.workspace = true
license-file.workspace = true
publish.workspace = true

# No GPUI here: the desktop client's screens use this, and so can any other Rust client.
[dependencies]
async-channel = "2.5"
base64 = "0.22"
getrandom = "0.3"
kuvo_wire = { path = "../../box/crates/kuvo_wire" }
kuvo_protocol = { path = "../../box/crates/kuvo_protocol" }
# Pictures made smaller before they go to another computer, as the phone makes them (`parts::carried`).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif", "webp"] }
percent-encoding = "2.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# The stand-in relay and host (`link::stand_in`), for tests and the app's `--stand-in`; not in the app shipped.
stand-in = []

[dev-dependencies]
tempfile = "3"
# The link's scenarios run against the stand-in relay and host.
kuvo_box = { path = ".", features = ["stand-in"] }
