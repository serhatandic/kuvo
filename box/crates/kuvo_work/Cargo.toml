[package]
name = "kuvo_work"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-stream = "0.3"
futures-core = "0.3"
getrandom = "0.4"
http = "1"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
kuvo_engine = { path = "../kuvo_engine" }
kuvo_os = { path = "../kuvo_os" }
kuvo_peers = { path = "../kuvo_peers" }
kuvo_protocol = { path = "../kuvo_protocol" }
kuvo_server = { path = "../kuvo_server" }
kuvo_store = { path = "../kuvo_store" }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1"
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "sync", "time"] }
