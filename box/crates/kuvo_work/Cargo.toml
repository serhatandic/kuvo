[package]
name = "kuvo_work"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-stream = "0.3"
getrandom = "0.4"
http = "1"
icu_collator = "2"
kuvo_engine = { path = "../kuvo_engine" }
kuvo_os = { path = "../kuvo_os" }
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
kuvo_peers = { path = "../kuvo_peers" }
kuvo_protocol = { path = "../kuvo_protocol" }
kuvo_server = { path = "../kuvo_server" }
kuvo_setup = { path = "../kuvo_setup" }
kuvo_store = { path = "../kuvo_store" }
kuvo_wire = { path = "../kuvo_wire" }
markdown = "=1.0.0"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "time"] }
unicode-normalization = "0.1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
