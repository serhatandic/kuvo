[package]
name = "kuvo_work"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-stream = "0.3"
base64 = "0.22"
filetime = "0.2"
futures-core = "0.3"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
hostname = "0.4"
http = "1"
http-body-util = "0.1"
icu_collator = "2"
kuvo_engine = { path = "../kuvo_engine" }
kuvo_os = { path = "../kuvo_os" }
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
kuvo_peers = { path = "../kuvo_peers" }
kuvo_protocol = { path = "../kuvo_protocol" }
kuvo_server = { path = "../kuvo_server" }
kuvo_services = { path = "../kuvo_services" }
kuvo_setup = { path = "../kuvo_setup" }
kuvo_store = { path = "../kuvo_store" }
kuvo_wire = { path = "../kuvo_wire" }
markdown = "=1.0.0"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
unicode-normalization = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
unicode-segmentation = "1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
