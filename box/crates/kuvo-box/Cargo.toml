[package]
name = "kuvo-box"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hostname = "0.4"
http = "1"
kuvo_protocol = { path = "../kuvo_protocol" }
kuvo_server = { path = "../kuvo_server" }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
