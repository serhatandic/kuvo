[package]
name = "kuvo-box"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hostname = "0.4"
http = "1"
kuvo_engine = { path = "../kuvo_engine" }
kuvo_peers = { path = "../kuvo_peers" }
kuvo_protocol = { path = "../kuvo_protocol" }
kuvo_server = { path = "../kuvo_server" }
kuvo_store = { path = "../kuvo_store" }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
futures-util = { version = "0.3", features = ["sink"] }
kuvo_wire = { path = "../kuvo_wire" }
tokio = { version = "1", features = ["macros", "process"] }
tokio-tungstenite = "0.29"
