[package]
name = "kuvo-box"
default-run = "kuvo-box"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
agent-runtime-fixture = []

[dependencies]
base64 = "0.22"
hostname = "0.4"
http = "1"
jiff = "0.2"
kuvo_agents = { path = "../kuvo_agents" }
kuvo_engine = { path = "../kuvo_engine" }
kuvo_keeper = { path = "../kuvo_keeper" }
kuvo_move = { path = "../kuvo_move" }
kuvo_os = { path = "../kuvo_os" }
kuvo_peers = { path = "../kuvo_peers" }
kuvo_services = { path = "../kuvo_services" }
kuvo_protocol = { path = "../kuvo_protocol" }
kuvo_server = { path = "../kuvo_server" }
kuvo_setup = { path = "../kuvo_setup" }
kuvo_store = { path = "../kuvo_store" }
kuvo_wire = { path = "../kuvo_wire" }
kuvo_work = { path = "../kuvo_work" }
async-stream = "0.3"
futures-core = "0.3"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"

[dev-dependencies]
http-body-util = "0.1"
tokio-util = "0.7"
tempfile = "3"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["macros", "process"] }
tokio-tungstenite = "0.29"
sha2 = "0.10"
