[package]
name = "kuvo_move"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
jiff = "0.2"
kuvo_os = { path = "../kuvo_os" }
kuvo_setup = { path = "../kuvo_setup" }
kuvo_store = { path = "../kuvo_store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = "0.37"
plist = "1"
sha2 = "0.10"
sha1 = "0.10"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
getrandom = "0.4"
hex = "0.4"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
