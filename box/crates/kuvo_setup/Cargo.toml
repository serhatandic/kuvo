[package]
name = "kuvo_setup"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.8"
ctr = "0.9"
ghash = "0.5"
async-stream = "0.3"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
kuvo_os = { path = "../kuvo_os" }
kuvo_peers = { path = "../kuvo_peers" }
kuvo_protocol = { path = "../kuvo_protocol" }
kuvo_server = { path = "../kuvo_server" }
kuvo_store = { path = "../kuvo_store" }
kuvo_wire = { path = "../kuvo_wire" }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

subtle = "2"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
kuvo_keeper = { path = "../kuvo_keeper" }
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
