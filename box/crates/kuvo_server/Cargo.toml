[package]
name = "kuvo_server"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-stream = "0.3"
base64 = "0.22"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
getrandom = "0.4"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
kuvo_os = { path = "../kuvo_os" }
kuvo_protocol = { path = "../kuvo_protocol" }
kuvo_store = { path = "../kuvo_store" }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = { version = "0.10", features = ["risky-raw-split"] }
aes-gcm = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["rt"] }
form_urlencoded = "1"
uuid = { version = "1", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
kuvo_wire = { path = "../kuvo_wire" }
tokio = { version = "1", features = ["test-util"] }
