[package]
name = "kuvo_services"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
ed25519-dalek = "2"
form_urlencoded = "1"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
icu_collator = "2"
jiff = "0.2"
kuvo_os = { path = "../kuvo_os" }
kuvo_protocol = { path = "../kuvo_protocol" }
kuvo_server = { path = "../kuvo_server" }
kuvo_setup = { path = "../kuvo_setup" }
kuvo_store = { path = "../kuvo_store" }
libc = "0.2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
regex = "1"
rusqlite = "0.37"
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-normalization = "0.1"
url = { version = "2", features = ["serde"] }
zeroize = { version = "1", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "p384", "p521"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
p256 = { version = "0.13", features = ["pem"] }
p384 = { version = "0.13", features = ["pem"] }
p521 = { version = "0.13", features = ["pem"] }
sha1 = { version = "0.11", features = ["oid"] }
ed25519-dalek = { version = "2", features = ["pem"] }
