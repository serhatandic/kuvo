[package]
name = "kuvo_agents"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
jiff = "0.2"
kuvo_os = { path = "../kuvo_os" }
kuvo_store = { path = "../kuvo_store" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt", "signal", "sync", "time"] }
