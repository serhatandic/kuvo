[package]
name = "kuvo_agents"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
jiff = "0.2"
kuvo_os = { path = "../kuvo_os" }
kuvo_store = { path = "../kuvo_store" }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt", "signal", "sync", "time"] }
tokio-util = "0.7"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
