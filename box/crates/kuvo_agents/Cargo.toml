[package]
name = "kuvo_agents"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
jiff = "0.2"
kuvo_os = { path = "../kuvo_os" }
kuvo_store = { path = "../kuvo_store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
