name: Release

# Builds the box's release: what every box runs, from the box's own sources (scripts/box-release.sh),
# with Kuvo Helper, the program a Mac's box runs under (scripts/build-helper.sh), signed with a
# Developer ID and notarized. The retired Swift Mac app isn't built here any more
# (swift/MAC-APP-REFERENCE.md).
#
# Running it by hand (Actions › Release › Run workflow) on main is a dry run: it builds, signs,
# notarizes and checks the helper, packs and signs the box's release, and uploads both files
# (boxes.json and box-<version>.tar.gz) as a workflow artifact instead of publishing a release. Use
# it to check the secrets and the release build itself.
#
# A tag publishes nothing yet. Kuvo Code 1.0 is the desktop app (gpui/), and a release is the
# app's disk image and update feed together with the box's release: until the desktop app is
# packaged here (#713, "Packaging the desktop app"), a vMAJOR.MINOR.PATCH tag stops at "verify
# release tag", so no release goes out without its download and its feed (installed copies read
# releases/latest/download/appcast.xml, and kuvo.run links to releases/latest/download/KuvoCode.dmg).
# What publishing does is kept below for that work: a draft with every file in dist/, published
# once all are uploaded; a vMAJOR.MINOR.PATCH-beta.N tag as a prerelease, never the latest, with the
# Unreleased notes as they are. The release notes are the version's section of CHANGELOG.md.
#
# The helper is signed with a Developer ID and notarized, so macOS runs it without a warning; the
# workflow stops if any of these secrets is missing.
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   MACOS_SIGNING_IDENTITY      the certificate's SHA-1 fingerprint, from
#                               `security find-identity -v -p codesigning`; safer
#                               than its name, which codesign misses when the name
#                               has accented letters
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool
#   KUVO_BOX_SIGNING_KEY        the Ed25519 key (PEM) that signs boxes.json; boxes take only what's
#                               signed with a key pinned in the box's link (UPDATE_KEYS, in box/src)
# scripts/set-box-key.sh makes that key once, keeps it in your login keychain, uploads it and
# prints the key to pin; the signing and notarization secrets come from
# scripts/set-signing-secrets.sh and scripts/set-notary-secrets.sh. (SPARKLE_PRIVATE_KEY, which
# signs the app's update feed, comes back with the desktop app's packaging: scripts/set-update-key.sh.)
#
# No kuvo-keys is built here: signed as Kuvo Code it reads Kuvo Code's Keychain items with no
# prompt, and none is to exist until #713 settles what keeps it to the box's move
# (scripts/build-helper.sh, KUVO_SIGNED_KEYS).
#
# The signing job runs in the `release` environment. GitHub makes one with no rules
# if it doesn't exist, so set it up in Settings › Environments before the next
# release: deployments from main and v* tags only, and the secrets above kept there
# rather than in the repository's, where any branch's workflow could read them.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch:

# One at a time, releases and betas alike: each writes the update feed from the one before (once
# the desktop app's feed is built here again). A
# dry run waits in a line of its own, so starting one never cancels a release waiting its turn.
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('release-dry-run-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Beside CI's jobs, so a wrong tag fails in seconds.
  verify:
    name: verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The checks below ask the remote about the tag and main, which a private
          # repository only answers with the job's read-only token.
          persist-credentials: true

      - name: Check a dry run is from main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "A dry run signs with the release secrets, so it runs only from main." >&2
            exit 1
          fi

      # Until the desktop app is packaged here (see the top): a release without its disk image and
      # its update feed would leave installed copies with no feed and kuvo.run with no download.
      - name: Check a release can be published
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "This workflow builds only the box's release now: a tag publishes nothing until the desktop app is packaged here (#713). Run it by hand on main for a dry run." >&2
          exit 1

      - name: Check the tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Release tags must look like vMAJOR.MINOR.PATCH, or vMAJOR.MINOR.PATCH-beta.N for a beta." >&2
            exit 1
          fi

          tag_ref="refs/tags/$GITHUB_REF_NAME"
          tag_oid="$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          peeled_oid="$(git ls-remote --tags origin "$tag_ref^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$tag_oid" || -z "$peeled_oid" ]]; then
            echo "Release tags must be annotated (git tag -a)." >&2
            exit 1
          fi
          if [[ "$peeled_oid" != "$(git rev-parse HEAD)" ]]; then
            echo "The release tag does not resolve to the checked-out commit." >&2
            exit 1
          fi

          # Releases come from main, but main may move on while a release builds.
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tags must point at a commit on main." >&2
            exit 1
          fi

  release:
    name: build and publish
    needs: [ci, verify]
    # Only a v* tag (which verify checked is on main) or a dry run from main gets the secrets.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: xcode-27
    # Limited in GitHub settings to main and v* tags, and holding the secrets (see the top).
    environment: release
    # The helper builds in a few minutes and its notarization takes a few; a hung one mustn't run for hours.
    timeout-minutes: 60
    permissions:
      contents: write
    # Each secret goes only to the steps that use it, not to the actions (checkout, setup-node,
    # setup-bun, upload-artifact) as well. No caches either: what's signed is built from the
    # checkout alone.
    env:
      # The certificate's fingerprint, which names it; not a key.
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For signing the box release (scripts/sign-box.mjs), the same pinned Node everywhere.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # For writing the box's files (box/src/release/files.ts), the Bun CI builds the box with.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Choose the version
        shell: bash
        env:
          KUVO_BOX_SIGNING_KEY: ${{ secrets.KUVO_BOX_SIGNING_KEY }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          # Notes come from CHANGELOG.md; checked now so a tag without them fails in seconds.
          # A beta's are what's under Unreleased so far.
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == *-beta.* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "BETA=true" >> "$GITHUB_ENV"
            ./scripts/release-notes.sh Unreleased > "$RUNNER_TEMP/notes.md"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          else
            # A dry run shows the newest notes, or a placeholder before there are any.
            ./scripts/release-notes.sh > "$RUNNER_TEMP/notes.md" || echo "Dry run." > "$RUNNER_TEMP/notes.md"
            echo "VERSION=0.0.0" >> "$GITHUB_ENV"
          fi
          # An unsigned or unnotarized helper makes macOS warn people, and a box takes no release
          # its key didn't sign: none go out.
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD KUVO_BOX_SIGNING_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "The $name secret is missing." >&2
              exit 1
            fi
          done

      - name: Import the signing certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          # Add ours to the search list, keeping the keychains already there.
          existing=()
          while IFS= read -r line; do
            existing+=("$(sed 's/^ *"//; s/"$//' <<< "$line")")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/certificate.p12"

      # Kuvo Helper, the program a Mac's box runs under (protocol/PROTOCOL.md, "This Mac's box: its
      # helper"), from its own package, with Kuvo Code's icon and this version, signed with the
      # hardened runtime and a secure timestamp. Its identifier (run.kuvo.code.box), its signer and
      # its entitlements stay what they were inside the Mac app: macOS keeps what you allowed it,
      # and its Keychain items, by them. KUVO_SIGNED_KEYS=0, whatever the environment says: no
      # kuvo-keys (see the top).
      - name: Build Kuvo Helper
        shell: bash
        run: |
          set -euo pipefail
          icon="$(./scripts/helper-icon.sh "$RUNNER_TEMP/helper-icon")"
          KUVO_SIGNED_KEYS=0 SIGN_IDENTITY="$MACOS_SIGNING_IDENTITY" APP_ID=run.kuvo.code \
            VERSION="$VERSION" BUILD="$(./scripts/build-version.sh "$VERSION")" ICON="$icon" \
            ./scripts/build-helper.sh build/helper
          helper="build/helper/Kuvo Helper.app"
          test ! -e build/helper/kuvo-keys || { echo "A kuvo-keys was built: none is to exist yet." >&2; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$helper/Contents/Info.plist")" = run.kuvo.code.box \
            || { echo "Unexpected bundle identifier" >&2; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$helper/Contents/Info.plist")" = "$VERSION"
          test -f "$helper/Contents/Resources/AppIcon.icns" || { echo "Kuvo Helper has no icon" >&2; exit 1; }
          codesign --verify --strict --deep --verbose=2 "$helper"
          codesign -d --verbose=2 "$helper" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "The hardened runtime is off" >&2; exit 1; }
          # (What macOS asks Kuvo Helper about needs its entitlements: Calendars and Reminders for
          # the box's integration, and the microphone.)
          entitlements="$(codesign -d --entitlements - --xml "$helper" 2>/dev/null)"
          for entitlement in personal-information.calendars device.audio-input; do
            grep -q "$entitlement" <<< "$entitlements" || { echo "Kuvo Helper lost its $entitlement entitlement as it was signed." >&2; exit 1; }
          done

      # On its own now (it was notarized inside the Mac app), with its ticket stapled to it: a box
      # that takes it offline still passes Gatekeeper. Before it's packed, so box.json names the
      # ticket with its other files.
      - name: Notarize Kuvo Helper
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          helper="build/helper/Kuvo Helper.app"
          ditto -c -k --keepParent "$helper" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$helper"
          codesign --verify --strict --deep --verbose=2 "$helper"
          # The same check macOS makes when a box first runs it.
          spctl --assess --type execute --verbose=2 "$helper"

      # What every box runs, for boxes to update themselves with (protocol/PROTOCOL.md, "Updates"):
      # the files this version puts on every box, from the box's sources, with Kuvo Helper, packed,
      # and boxes.json, a manifest naming the pack and the engine's builds, signed. The key goes to
      # this step alone.
      - name: Package the box release
        shell: bash
        env:
          KUVO_BOX_SIGNING_KEY: ${{ secrets.KUVO_BOX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir dist
          # (From this checkout's own sources, whatever the environment names.)
          env -u BOX_SOURCES ./scripts/box-release.sh "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/box-$VERSION.tar.gz" \
            dist "build/helper/Kuvo Helper.app"

      # As a box would find it: both files, the pack what boxes.json says, the helper in it still
      # signed and notarized, and box.json naming this version and its files.
      - name: Check the box release
        shell: bash
        run: |
          set -euo pipefail
          for file in boxes.json "box-$VERSION.tar.gz"; do
            test -s "dist/$file" || { echo "Missing dist/$file" >&2; exit 1; }
          done
          mkdir "$RUNNER_TEMP/box"
          tar -xzf "dist/box-$VERSION.tar.gz" -C "$RUNNER_TEMP/box"
          node --input-type=module - dist/boxes.json "dist/box-$VERSION.tar.gz" "$RUNNER_TEMP/box" "$VERSION" <<'EOF'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          const [boxes, pack, folder, version] = process.argv.slice(2);
          const fail = message => { console.error(message); process.exit(1); };
          const sha256 = file => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const manifest = JSON.parse(Buffer.from(JSON.parse(fs.readFileSync(boxes, "utf8")).manifest, "base64").toString("utf8"));
          if (manifest.version !== version) fail(`boxes.json is ${manifest.version}'s, not ${version}'s.`);
          if (manifest.pack.sha256 !== sha256(pack)) fail("boxes.json doesn't name this pack.");
          const box = JSON.parse(fs.readFileSync(path.join(folder, "box.json"), "utf8"));
          if (box.version !== version || box.engine !== manifest.engine) fail("box.json isn't this release's.");
          for (const file of ["bin/kuvo-link.js", "bin/kuvo-agents.js", "bin/kuvo-browser.js", "bin/kuvo-start", "bin/kuvo-launch", "bin/kuvo-wake", "bin/integrations.json", "bin/bot-words.json"]) {
            if (!box.files[file]) fail(`The release has no ${file}.`);
          }
          for (const [file, sha] of Object.entries(box.files)) if (sha256(path.join(folder, file)) !== sha) fail(`${file} isn't what box.json says.`);
          const helper = box.bundles?.["bin/Kuvo Helper.app"];
          if (!helper?.["Contents/MacOS/Kuvo Helper"]) fail("The release has no Kuvo Helper.");
          for (const [file, sha] of Object.entries(helper)) if (sha256(path.join(folder, "bin/Kuvo Helper.app", file)) !== sha) fail(`Kuvo Helper's ${file} isn't what box.json says.`);
          EOF
          codesign --verify --strict --deep --verbose=2 "$RUNNER_TEMP/box/bin/Kuvo Helper.app"
          spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/box/bin/Kuvo Helper.app"

      - name: Upload the dry-run build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KuvoCode-box-dry-run
          path: dist/
          retention-days: 3

      # Not reached today: a tag stops at "verify release tag" (see the top). Before that guard
      # goes, the desktop app's disk image and its update feed have to be built into dist/ again
      # (KuvoCode.dmg and appcast.xml: scripts/build-dmg.sh, scripts/appcast.sh and
      # scripts/merge-appcast.py, with SPARKLE_PRIVATE_KEY), so this refuses a release without them.
      - name: Publish the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in KuvoCode.dmg appcast.xml boxes.json "box-$VERSION.tar.gz"; do
            test -s "dist/$file" || { echo "dist/$file is missing: a release is the app's disk image, its update feed and the box's release together." >&2; exit 1; }
          done
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]]; then
              echo "A published release already exists for $GITHUB_REF_NAME." >&2
              exit 1
            fi
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi

          if [[ "${BETA:-}" == true ]]; then
            { printf 'A beta of what comes next, for trying it out before it’s released: Kuvo Code offers it with Settings › General › Get beta updates on.\n\n'; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/beta-notes.md"
            mv "$RUNNER_TEMP/beta-notes.md" "$RUNNER_TEMP/notes.md"
          fi
          printf '\n\nRequires macOS 26 or later on Apple silicon. Signed with a Developer ID and notarized by Apple.\n' >> "$RUNNER_TEMP/notes.md"
          kind=()
          if [[ "${BETA:-}" == true ]]; then kind=(--prerelease); fi
          # --generate-notes adds the link to the full list of commits after these notes.
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft ${kind[@]+"${kind[@]}"} --title "Kuvo Code ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes-file "$RUNNER_TEMP/notes.md"

          expected="$(find dist -type f -exec basename {} \; | sort)"
          actual="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          if [[ "$expected" != "$actual" ]]; then
            echo "Uploaded assets don't match:" >&2
            diff <(echo "$expected") <(echo "$actual") >&2 || true
            exit 1
          fi

          if [[ "${BETA:-}" != true ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
            # Installed copies read the newest release's feed, so the beta goes there too. The
            # upload replaces the feed by taking the old one off first: checked, and tried again,
            # so that release isn't left without one.
            latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            for attempt in 1 2 3; do
              if gh release upload "$latest" dist/appcast.xml --repo "$GITHUB_REPOSITORY" --clobber; then break; fi
              if [[ $attempt == 3 ]]; then
                if gh release view "$latest" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx appcast.xml; then
                  echo "$latest still has its old feed, without this beta: upload dist/appcast.xml there by hand." >&2
                else
                  echo "$latest is left without its update feed: upload dist/appcast.xml there by hand." >&2
                fi
                exit 1
              fi
              sleep 10
            done
          fi
