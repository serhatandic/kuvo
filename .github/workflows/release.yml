name: Release

# Builds a release: the box's release, what every box runs, from the box's own sources
# (scripts/box-release.sh), with Kuvo Helper, the program a Mac's box runs under
# (scripts/build-helper.sh); and the desktop app (gpui/, scripts/build-desktop-app.sh) carrying that
# very release, with Sparkle to update itself; all signed with a Developer ID and notarized; the
# app's disk image (KuvoCode.dmg); and its update feed (appcast.xml), which installed copies read,
# the desktop app's and Kuvo Code 0.7's alike (releases/latest/download/appcast.xml), so 0.7 updates
# into the desktop app.
#
# Running it by hand (Actions › Release › Run workflow) on main is a dry run: it builds, signs,
# notarizes and checks all of it, and uploads dist/ (boxes.json, box-<version>.tar.gz, kuvo-install,
# appcast.xml; not the disk image) as a workflow artifact instead of publishing a release. Use it to check
# the secrets and the release build itself.
#
# A tag publishes nothing yet: a vMAJOR.MINOR.PATCH tag stops at "verify release tag" until the
# desktop app's first release is decided (.claude/notes/759-desktop-app-updates.md): its kuvo-keys,
# signed with the Developer ID only once #713 piece 4 settles what keeps it to the box's move (a
# dry run's app has none: scripts/sign-desktop-app.sh takes it out), and the rehearsal of 0.7
# updating into it. What publishing does is below: a draft with every file in dist/, published once
# all are uploaded; a vMAJOR.MINOR.PATCH-beta.N tag as a prerelease, never the latest, with the
# Unreleased notes as they are. The release notes are the version's section of CHANGELOG.md.
#
# The helper and the app are signed with a Developer ID and notarized, so macOS runs them without
# a warning; the workflow stops if any of these secrets is missing.
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   MACOS_SIGNING_IDENTITY      the certificate's SHA-1 fingerprint, from
#                               `security find-identity -v -p codesigning`; safer
#                               than its name, which codesign misses when the name
#                               has accented letters
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool
#   KUVO_BOX_SIGNING_KEY        the Ed25519 key (PEM) that signs boxes.json; boxes take only what's
#                               signed with a key pinned in the box's link (UPDATE_KEYS, in box/src)
#   SPARKLE_PRIVATE_KEY         the EdDSA key that signs each update in the feed; installed copies
#                               (0.7's too) take only updates signed with it
# scripts/set-box-key.sh makes that key once, keeps it in your login keychain, uploads it and
# prints the key to pin; the signing and notarization secrets come from
# scripts/set-signing-secrets.sh and scripts/set-notary-secrets.sh; SPARKLE_PRIVATE_KEY from
# scripts/set-update-key.sh, from the key in your login keychain.
#
# No kuvo-keys is built here: signed as Kuvo Code it reads Kuvo Code's Keychain items with no
# prompt, and none is to exist until #713 settles what keeps it to the box's move
# (scripts/build-helper.sh, KUVO_SIGNED_KEYS).
#
# The signing job runs in the `release` environment. GitHub makes one with no rules
# if it doesn't exist, so set it up in Settings › Environments before the next
# release: deployments from main and v* tags only, and the secrets above kept there
# rather than in the repository's, where any branch's workflow could read them.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Version for the dry-run artifacts
        type: string
        default: "0.0.0"
      rust_packs:
        description: Build and sign the Rust box target packs
        type: boolean
        default: false
      typescript_bridge:
        description: Signed TypeScript bridge boxes.json to include with Rust packs
        type: string
        required: false

# One at a time, releases and betas alike: each writes the update feed from the one before. A
# dry run waits in a line of its own, so starting one never cancels a release waiting its turn.
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('release-dry-run-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The checks below ask the remote about the tag and main, which a private
          # repository only answers with the job's read-only token.
          persist-credentials: true

      - name: Check a dry run is from main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "A dry run signs with the release secrets, so it runs only from main." >&2
            exit 1
          fi

      # Until the desktop app's first release is decided (see the top).
      - name: Check a release can be published
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "A tag publishes nothing until the desktop app's first release is decided: its kuvo-keys signed (#713 piece 4) and 0.7's update into it rehearsed (.claude/notes/759-desktop-app-updates.md). Run it by hand on main for a dry run." >&2
          exit 1

      - name: Check the tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Release tags must look like vMAJOR.MINOR.PATCH, or vMAJOR.MINOR.PATCH-beta.N for a beta." >&2
            exit 1
          fi

          tag_ref="refs/tags/$GITHUB_REF_NAME"
          tag_oid="$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          peeled_oid="$(git ls-remote --tags origin "$tag_ref^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$tag_oid" || -z "$peeled_oid" ]]; then
            echo "Release tags must be annotated (git tag -a)." >&2
            exit 1
          fi
          if [[ "$peeled_oid" != "$(git rev-parse HEAD)" ]]; then
            echo "The release tag does not resolve to the checked-out commit." >&2
            exit 1
          fi

          # Releases come from main, but main may move on while a release builds.
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tags must point at a commit on main." >&2
            exit 1
          fi

  rust_targets:
    name: Build ${{ matrix.target }}
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.rust_packs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: xcode-27
          - target: x86_64-apple-darwin
            runner: macos-26-intel
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-gnullvm
            runner: ubuntu-24.04
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: box/.bun-version

      - name: Build the box program
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/program"
          mkdir "$out"
          executable=kuvo-box
          case "$TARGET" in
            *-unknown-linux-musl)
              sudo apt-get update -q
              sudo apt-get install -qy --no-install-recommends musl-tools
              export CC=musl-gcc
              ;;
            *-pc-windows-gnullvm)
              tool=llvm-mingw-20261117-ucrt-ubuntu-22.04-x86_64
              curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/$tool.tar.xz" -o "$RUNNER_TEMP/$tool.tar.xz"
              printf '%s  %s\n' e7a15a49a2ea95e9f3d8a9d0cfabe5052a4b10fb4777cc54de5a8c27b64bb701 "$RUNNER_TEMP/$tool.tar.xz" | sha256sum -c -
              tar -xf "$RUNNER_TEMP/$tool.tar.xz" -C "$RUNNER_TEMP"
              export PATH="$RUNNER_TEMP/$tool/bin:$PATH"
              export CC_x86_64_pc_windows_gnullvm=x86_64-w64-mingw32-clang
              export AR_x86_64_pc_windows_gnullvm=llvm-ar
              export CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER=x86_64-w64-mingw32-clang
              cp "$RUNNER_TEMP/$tool/x86_64-w64-mingw32/bin/libunwind.dll" "$out/"
              executable=kuvo-box.exe
              ;;
            *-apple-darwin)
              export MACOSX_DEPLOYMENT_TARGET=13.0
              ;;
          esac
          (cd box && rustup target add "$TARGET")
          ./scripts/build-built.sh
          CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target" ./scripts/cargo-box.sh build --locked --release -j 2 --target "$TARGET" -p kuvo-box --bin kuvo-box
          program="$RUNNER_TEMP/cargo-target/$TARGET/release/$executable"
          if [[ "$TARGET" != *-pc-windows-gnullvm ]]; then
            "$program" selftest --engine "$(node -p 'require("./box/src/shared/engine-pin.json").version')"
          fi
          cp "$program" "$out/$executable"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-program-${{ matrix.target }}
          path: ${{ runner.temp }}/program/
          if-no-files-found: error
          retention-days: 3

  release:
    name: build and publish
    needs: [verify, rust_targets]
    # Only a v* tag (which verify checked is on main) or a dry run from main gets the secrets.
    if: >-
      !cancelled() && needs.verify.result == 'success'
      && (needs.rust_targets.result == 'success' || needs.rust_targets.result == 'skipped')
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: xcode-27
    # Limited in GitHub settings to main and v* tags, and holding the secrets (see the top).
    environment: release
    # The desktop app's Rust build and two notarizations take the most; a hung one mustn't run for hours.
    timeout-minutes: 120
    permissions:
      contents: write
    # Each secret goes only to the steps that use it, not to the actions (checkout, setup-node,
    # setup-bun, upload-artifact) as well. No caches either: what's signed is built from the
    # checkout alone.
    env:
      # The certificate's fingerprint, which names it; not a key.
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For signing the box release (scripts/sign-box.mjs), the same pinned Node everywhere.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # For writing the box's files (box/src/release/files.ts), the box's pinned Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: box/.bun-version

      - name: Choose the version
        shell: bash
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
          KUVO_BOX_SIGNING_KEY: ${{ secrets.KUVO_BOX_SIGNING_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          # Notes come from CHANGELOG.md; checked now so a tag without them fails in seconds.
          # A beta's are what's under Unreleased so far.
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == *-beta.* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "BETA=true" >> "$GITHUB_ENV"
            ./scripts/release-notes.sh Unreleased > "$RUNNER_TEMP/notes.md"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          else
            # A dry run shows the newest notes, or a placeholder before there are any.
            ./scripts/release-notes.sh > "$RUNNER_TEMP/notes.md" || echo "Dry run." > "$RUNNER_TEMP/notes.md"
            if [[ ! "$DRY_RUN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
              echo "The dry-run version must look like MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-beta.N." >&2
              exit 1
            fi
            echo "VERSION=$DRY_RUN_VERSION" >> "$GITHUB_ENV"
          fi
          # An unsigned or unnotarized app or helper makes macOS warn people, a box takes no release
          # its key didn't sign, and installed copies no update the update key didn't: none go out.
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD KUVO_BOX_SIGNING_KEY SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "The $name secret is missing." >&2
              exit 1
            fi
          done

      # The desktop app's program, compiled before the signing certificate is imported: compiling
      # runs every dependency's build script (Zed's crates, from git), and none of them may run
      # while the Developer ID is usable. "Build the desktop app" compiles nothing again (the same
      # command, version and checkout) and checks it didn't.
      - name: Compile the desktop app
        shell: bash
        run: |
          set -euo pipefail
          (cd gpui && rustup toolchain install)
          (cd gpui && KUVO_APP_VERSION="$VERSION" ../scripts/cargo-locked.sh build --release --locked -p kuvo --bin kuvo)
          target=$(cd gpui && cargo metadata --format-version 1 --no-deps --locked | node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(0, "utf8")).target_directory)')
          echo "KUVO_PROGRAM=$target/release/kuvo" >> "$GITHUB_ENV"
          echo "KUVO_PROGRAM_SHA=$(shasum -a 256 "$target/release/kuvo" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Import the signing certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          # Add ours to the search list, keeping the keychains already there.
          existing=()
          while IFS= read -r line; do
            existing+=("$(sed 's/^ *"//; s/"$//' <<< "$line")")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/certificate.p12"

      # Kuvo Helper, the program a Mac's box runs under (protocol/PROTOCOL.md, "This Mac's box: its
      # helper"), from its own package, with Kuvo Code's icon and this version, signed with the
      # hardened runtime and a secure timestamp. Its identifier (run.kuvo.code.box), its signer and
      # its entitlements stay what they were inside the Mac app: macOS keeps what you allowed it,
      # and its Keychain items, by them. KUVO_SIGNED_KEYS=0, whatever the environment says: no
      # kuvo-keys (see the top).
      - name: Build Kuvo Helper
        shell: bash
        run: |
          set -euo pipefail
          icon="$(./scripts/helper-icon.sh "$RUNNER_TEMP/helper-icon")"
          KUVO_SIGNED_KEYS=0 SIGN_IDENTITY="$MACOS_SIGNING_IDENTITY" APP_ID=run.kuvo.code \
            VERSION="$VERSION" BUILD="$(./scripts/build-version.sh "$VERSION")" ICON="$icon" \
            ./scripts/build-helper.sh build/helper
          helper="build/helper/Kuvo Helper.app"
          test ! -e build/helper/kuvo-keys || { echo "A kuvo-keys was built: none is to exist yet." >&2; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$helper/Contents/Info.plist")" = run.kuvo.code.box \
            || { echo "Unexpected bundle identifier" >&2; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$helper/Contents/Info.plist")" = "$VERSION"
          test -f "$helper/Contents/Resources/AppIcon.icns" || { echo "Kuvo Helper has no icon" >&2; exit 1; }
          codesign --verify --strict --deep --verbose=2 "$helper"
          codesign -d --verbose=2 "$helper" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "The hardened runtime is off" >&2; exit 1; }
          # (What macOS asks Kuvo Helper about needs its entitlements: Calendars and Reminders for
          # the box's integration, and the microphone.)
          entitlements="$(codesign -d --entitlements - --xml "$helper" 2>/dev/null)"
          for entitlement in personal-information.calendars device.audio-input; do
            grep -q "$entitlement" <<< "$entitlements" || { echo "Kuvo Helper lost its $entitlement entitlement as it was signed." >&2; exit 1; }
          done

      # On its own now (it was notarized inside the Mac app), with its ticket stapled to it: a box
      # that takes it offline still passes Gatekeeper. Before it's packed, so box.json names the
      # ticket with its other files.
      - name: Notarize Kuvo Helper
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          helper="build/helper/Kuvo Helper.app"
          ditto -c -k --keepParent "$helper" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$helper"
          codesign --verify --strict --deep --verbose=2 "$helper"
          # The same check macOS makes when a box first runs it.
          spctl --assess --type execute --verbose=2 "$helper"

      # What every box runs, for boxes to update themselves with (protocol/PROTOCOL.md, "Updates"):
      # the files this version puts on every box, from the box's sources, with Kuvo Helper, packed,
      # and boxes.json, a manifest naming the pack and the engine's builds, signed. The key goes to
      # this step alone.
      # The release check of its engines (protocol/PROTOCOL.md, "A new engine"): the link and the
      # bridge answer selftest on the pinned engine and the one the release before ran, and that one
      # opens what the new one wrote. What it found goes in box.json (`engines`, `downgradeSafe`).
      - name: Check the engines
        shell: bash
        run: node scripts/engine-check.mjs "$RUNNER_TEMP/engine-check.json"

      - name: Package the box release
        shell: bash
        env:
          KUVO_BOX_SIGNING_KEY: ${{ secrets.KUVO_BOX_SIGNING_KEY }}
          # (A release for everyone: your computers hand it to each other.)
          KUVO_BOX_SPREADS: "1"
          ENGINE_CHECK: ${{ runner.temp }}/engine-check.json
        run: |
          set -euo pipefail
          mkdir dist
          # (From this checkout's own sources, whatever the environment names.)
          env -u BOX_SOURCES ./scripts/box-release.sh "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/box-$VERSION.tar.gz" \
            dist "build/helper/Kuvo Helper.app"

      # As a box would find it: both files, the pack what boxes.json says, the helper in it still
      # signed and notarized, and box.json naming this version and its files.
      - name: Check the box release
        shell: bash
        run: |
          set -euo pipefail
          for file in boxes.json "box-$VERSION.tar.gz"; do
            test -s "dist/$file" || { echo "Missing dist/$file" >&2; exit 1; }
          done
          mkdir "$RUNNER_TEMP/box"
          tar -xzf "dist/box-$VERSION.tar.gz" -C "$RUNNER_TEMP/box"
          node --input-type=module - dist/boxes.json "dist/box-$VERSION.tar.gz" "$RUNNER_TEMP/box" "$VERSION" <<'EOF'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          const [boxes, pack, folder, version] = process.argv.slice(2);
          const fail = message => { console.error(message); process.exit(1); };
          const sha256 = file => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          const manifest = JSON.parse(Buffer.from(JSON.parse(fs.readFileSync(boxes, "utf8")).manifest, "base64").toString("utf8"));
          if (manifest.version !== version) fail(`boxes.json is ${manifest.version}'s, not ${version}'s.`);
          if (manifest.pack.sha256 !== sha256(pack)) fail("boxes.json doesn't name this pack.");
          const box = JSON.parse(fs.readFileSync(path.join(folder, "box.json"), "utf8"));
          if (box.version !== version || box.engine !== manifest.engine) fail("box.json isn't this release's.");
          for (const file of ["bin/kuvo-link.js", "bin/kuvo-agents.js", "bin/kuvo-browser.js", "bin/kuvo-start", "bin/kuvo-launch", "bin/kuvo-wake", "bin/integrations.json", "bin/bot-words.json"]) {
            if (!box.files[file]) fail(`The release has no ${file}.`);
          }
          for (const [file, sha] of Object.entries(box.files)) if (sha256(path.join(folder, file)) !== sha) fail(`${file} isn't what box.json says.`);
          const helper = box.bundles?.["bin/Kuvo Helper.app"];
          if (!helper?.["Contents/MacOS/Kuvo Helper"]) fail("The release has no Kuvo Helper.");
          for (const [file, sha] of Object.entries(helper)) if (sha256(path.join(folder, "bin/Kuvo Helper.app", file)) !== sha) fail(`Kuvo Helper's ${file} isn't what box.json says.`);
          EOF
          codesign --verify --strict --deep --verbose=2 "$RUNNER_TEMP/box/bin/Kuvo Helper.app"
          spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/box/bin/Kuvo Helper.app"

      - name: Download the Rust target programs
        if: github.event_name == 'workflow_dispatch' && inputs.rust_packs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-program-*
          path: ${{ runner.temp }}/rust-programs

      - name: Sign and notarize the Mac box programs
        if: github.event_name == 'workflow_dispatch' && inputs.rust_packs
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          mac_programs="$RUNNER_TEMP/mac-box-programs"
          mkdir "$mac_programs"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            program="$RUNNER_TEMP/rust-programs/rust-program-$target/kuvo-box"
            chmod 755 "$program"
            arch="${target%%-*}"
            if [[ "$arch" == aarch64 ]]; then arch=arm64; fi
            test "$(lipo -archs "$program")" = "$arch"
            codesign --force --sign "$MACOS_SIGNING_IDENTITY" --options runtime --timestamp "$program"
            codesign --verify --strict "$program"
            cp -p "$program" "$mac_programs/kuvo-box-$target"
          done
          ditto -c -k --keepParent "$mac_programs" "$RUNNER_TEMP/mac-box-programs.zip"
          xcrun notarytool submit "$RUNNER_TEMP/mac-box-programs.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --output-format json > "$RUNNER_TEMP/mac-box-notary.json"
          node -e 'const r = require(process.argv[1]); if (r.status !== "Accepted") throw new Error("Mac box notarization: " + r.status)' "$RUNNER_TEMP/mac-box-notary.json"

      - name: Assemble the Rust target packs
        if: github.event_name == 'workflow_dispatch' && inputs.rust_packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/rust-release"
          cp "dist/box-$VERSION.tar.gz" "$RUNNER_TEMP/rust-release/"
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnullvm; do
            program="$RUNNER_TEMP/rust-programs/rust-program-$target/kuvo-box"
            if [[ "$target" == *-pc-windows-gnullvm ]]; then program="$program.exe"; fi
            folder="$RUNNER_TEMP/rust-target-$target"
            args=(--rust-pack "$target" "$program" "$VERSION" "$folder")
            case "$target" in
              *-apple-darwin) args+=("build/helper/Kuvo Helper.app") ;;
            esac
            env -u BOX_SOURCES -u ENGINE_CHECK ./scripts/box-release.sh "${args[@]}"
            cp "$folder/box-$VERSION-$target.tar.gz" "$RUNNER_TEMP/rust-release/"
          done

      - name: Sign the Rust box release manifest
        if: github.event_name == 'workflow_dispatch' && inputs.rust_packs
        shell: bash
        env:
          KUVO_BOX_SIGNING_KEY: ${{ secrets.KUVO_BOX_SIGNING_KEY }}
          KUVO_BOX_SPREADS: "1"
          TYPESCRIPT_BRIDGE: ${{ inputs.typescript_bridge }}
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/rust-release"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/box-$VERSION.tar.gz"
          args=("$VERSION" "$folder/box-$VERSION.tar.gz" "$url" --rust-packs)
          if [[ -n "$TYPESCRIPT_BRIDGE" ]]; then
            printf '%s\n' "$TYPESCRIPT_BRIDGE" > "$RUNNER_TEMP/bridge-boxes.json"
            args+=(--bridge "$RUNNER_TEMP/bridge-boxes.json")
          fi
          node scripts/sign-box.mjs "${args[@]}" > "$folder/boxes.json.new"
          mv "$folder/boxes.json.new" "$folder/boxes.json"

      - name: Upload the signed Rust box packs
        if: github.event_name == 'workflow_dispatch' && inputs.rust_packs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KuvoBox-Rust-dry-run
          path: ${{ runner.temp }}/rust-release/
          if-no-files-found: error
          retention-days: 3

      # The desktop app, carrying the box's release above (the very files published beside it), with
      # Sparkle (scripts/sparkle.sh's pinned release) and the feed it and 0.7 read. Built ad hoc,
      # then signed inside out with the Developer ID (scripts/sign-desktop-app.sh), checked as a
      # Mac would find it. Rust as gpui/rust-toolchain.toml pins it.
      - name: Build the desktop app
        shell: bash
        run: |
          set -euo pipefail
          # FEED=1: the only build that names Kuvo Code's own feed and key (0.7's), for updates.
          FEED=1 VERSION="$VERSION" BOX_RELEASE=dist OUT=build ./scripts/build-desktop-app.sh
          # (What "Compile the desktop app" compiled, before the certificate was imported: nothing
          # was compiled since.)
          test "$(shasum -a 256 "$KUVO_PROGRAM" | cut -d ' ' -f 1)" = "$KUVO_PROGRAM_SHA" \
            || { echo "The desktop app was compiled again after the signing certificate was imported." >&2; exit 1; }
          # (No kuvo-keys signed with the Developer ID yet: see the top. Publishing refuses an app without one.)
          KUVO_SIGNED_KEYS=0 SIGN_IDENTITY="$MACOS_SIGNING_IDENTITY" ./scripts/sign-desktop-app.sh build/Kuvo.app
          WITHOUT_KEYS=1 ./scripts/check-desktop-app.sh build/Kuvo.app
          app=build/Kuvo.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = run.kuvo.code \
            || { echo "Unexpected bundle identifier" >&2; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$(./scripts/build-version.sh "$VERSION")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app/Contents/Info.plist")" = https://github.com/serhatandic/kuvo-code/releases/latest/download/appcast.xml \
            || { echo "The app doesn't read Kuvo Code's own update feed" >&2; exit 1; }
          codesign --verify --strict --deep --verbose=2 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "The hardened runtime is off" >&2; exit 1; }
          # Signed with the Developer ID and the hardened runtime, it loads its own Sparkle (library
          # validation takes one team's), as it will to update itself; nothing else runs.
          "$app/Contents/MacOS/kuvo" --updater-status | tee "$RUNNER_TEMP/updater-status"
          grep -qx "feed: https://github.com/serhatandic/kuvo-code/releases/latest/download/appcast.xml" "$RUNNER_TEMP/updater-status"

      - name: Notarize the desktop app
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent build/Kuvo.app "$RUNNER_TEMP/notarize-app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize-app.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/Kuvo.app
          # The same check macOS makes when someone opens the download.
          spctl --assess --type execute --verbose=2 build/Kuvo.app

      # The download: a disk image with the app and a link to Applications, notarized on its own,
      # so it opens without a warning too. Updates install from the same disk image.
      - name: Build the disk image
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          APP=build/Kuvo.app SIGN_IDENTITY="$MACOS_SIGNING_IDENTITY" ./scripts/build-dmg.sh
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" build/KuvoCode.dmg >/dev/null
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          test -d "$mount/Kuvo.app" || { echo "Kuvo.app is missing from the disk image" >&2; exit 1; }
          test "$(readlink "$mount/Applications")" = /Applications || { echo "The Applications link is missing" >&2; exit 1; }
          hdiutil detach "$mount" >/dev/null
          trap - EXIT
          xcrun notarytool submit build/KuvoCode.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/KuvoCode.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 build/KuvoCode.dmg
          # Unversioned, so kuvo.run/code can always link to releases/latest/download/KuvoCode.dmg.
          cp build/KuvoCode.dmg dist/KuvoCode.dmg

      # The update feed: this version's item, signed with the update key, with the newest of the
      # other kind (a release, or a newer beta) from the feed that's out, on the newest release.
      # None before the first release with one; one that lost its feed starts it again. Anything
      # else (GitHub not answering) stops here rather than leave betas or releases out.
      - name: Write the update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ./scripts/appcast.sh "$VERSION" dist/KuvoCode.dmg \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/KuvoCode.dmg" "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/item.xml"
          mkdir "$RUNNER_TEMP/current"
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            : # A dry run shows the feed of what it built.
          elif latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>"$RUNNER_TEMP/view.err")"; then
            if ! gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir "$RUNNER_TEMP/current" 2>"$RUNNER_TEMP/download.err"; then
              grep -qi "no assets match" "$RUNNER_TEMP/download.err" || { cat "$RUNNER_TEMP/download.err" >&2; exit 1; }
              echo "$latest has no update feed: this one starts it again." >&2
            fi
          elif ! grep -qi "release not found" "$RUNNER_TEMP/view.err"; then
            cat "$RUNNER_TEMP/view.err" >&2
            exit 1
          fi
          python3 ./scripts/merge-appcast.py "$RUNNER_TEMP/item.xml" "$RUNNER_TEMP/current/appcast.xml" > dist/appcast.xml
          cat dist/appcast.xml

      # (Not the disk image: its app is Kuvo Code itself, signed and notarized, and with no kuvo-keys;
      # opened, it would move a Mac's Kuvo Code 0.7 without handing its Keychain items over.)
      - name: Upload the dry-run build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KuvoCode-dry-run
          path: |
            dist/
            !dist/KuvoCode.dmg
          retention-days: 3

      # Not reached today: a tag stops at "verify release tag" (see the top).
      - name: Publish the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in KuvoCode.dmg appcast.xml boxes.json "box-$VERSION.tar.gz"; do
            test -s "dist/$file" || { echo "dist/$file is missing: a release is the app's disk image, its update feed and the box's release together." >&2; exit 1; }
          done
          # (An app that can't hand Kuvo Code 0.7's Keychain items over isn't one 0.7 may update into.)
          test -x build/Kuvo.app/Contents/MacOS/kuvo-keys || { echo "The desktop app has no kuvo-keys: it's signed for a release only once #713 piece 4 says so (KUVO_SIGNED_KEYS)." >&2; exit 1; }
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]]; then
              echo "A published release already exists for $GITHUB_REF_NAME." >&2
              exit 1
            fi
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi

          if [[ "${BETA:-}" == true ]]; then
            { printf 'A beta of what comes next, for trying it out before it’s released: Kuvo offers it with Settings › Updates › Get beta updates on (in Kuvo Code 0.7, Settings › General).\n\n'; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/beta-notes.md"
            mv "$RUNNER_TEMP/beta-notes.md" "$RUNNER_TEMP/notes.md"
          fi
          printf '\n\nRequires macOS 26 or later on Apple silicon. Signed with a Developer ID and notarized by Apple.\n' >> "$RUNNER_TEMP/notes.md"
          kind=()
          if [[ "${BETA:-}" == true ]]; then kind=(--prerelease); fi
          # --generate-notes adds the link to the full list of commits after these notes.
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft ${kind[@]+"${kind[@]}"} --title "Kuvo Code ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes-file "$RUNNER_TEMP/notes.md"

          expected="$(find dist -type f -exec basename {} \; | sort)"
          actual="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          if [[ "$expected" != "$actual" ]]; then
            echo "Uploaded assets don't match:" >&2
            diff <(echo "$expected") <(echo "$actual") >&2 || true
            exit 1
          fi

          if [[ "${BETA:-}" != true ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
            # Installed copies read the newest release's feed, so the beta goes there too. The
            # upload replaces the feed by taking the old one off first: checked, and tried again,
            # so that release isn't left without one.
            latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            for attempt in 1 2 3; do
              if gh release upload "$latest" dist/appcast.xml --repo "$GITHUB_REPOSITORY" --clobber; then break; fi
              if [[ $attempt == 3 ]]; then
                if gh release view "$latest" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx appcast.xml; then
                  echo "$latest still has its old feed, without this beta: upload dist/appcast.xml there by hand." >&2
                else
                  echo "$latest is left without its update feed: upload dist/appcast.xml there by hand." >&2
                fi
                exit 1
              fi
              sleep 10
            done
          fi
